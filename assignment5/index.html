<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استفسر عن كورس · نموذج بسيط</title>
</head>
<body>

  <div class="form-card">
    <form  method="post">
      <fieldset>
        <legend>استفسر عن كورس</legend>

        <!-- الاسم الكامل -->
        <div class="form-group">
          <label for="fullName">الاسم الكامل</label>
          <input type="text"
                 id="fullName"
                 name="fullName"
                 placeholder="مثال: أحمد محمد"
                 autocomplete="name"
                 required>
        </div>

        <!-- البريد الإلكتروني -->
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email"
                 id="email"
                 name="email"
                 placeholder="example@mail.com"
                 autocomplete="email"
                 required>
        </div>

        <!-- رقم الهاتف -->
        <div class="form-group">
          <label for="phone">رقم الهاتف</label>
          <input type="tel"
                 id="phone"
                 name="phone"
                 placeholder="+962 7X XXX XXXX"
                 autocomplete="tel"
                 required>
        </div>

        <!-- الكورس -->
        <div class="form-group">
          <label for="course">الكورس</label>
          <select id="course" name="course" required>
            <option value="" disabled selected>اختر كورسًا</option>
            <option value="content">HTML Content</option>
            <option value="forms">HTML Forms</option>
          </select>
        </div>

        <!-- عدد المقاعد -->
        <div class="form-group">
          <label for="seats">عدد المقاعد</label>
          <input type="number"
                 id="seats"
                 name="seats"
                 value="1"
                 min="1"
                 required>
          <span class="hint">الحد الأدنى: 1</span>
        </div>

        <!-- التاريخ المفضل -->
        <div class="form-group">
          <label for="date">التاريخ المفضل</label>
          <input type="date"
                 id="date"
                 name="date"
                 required>
        </div>

        <!-- نص الاستفسار -->
        <div class="form-group">
          <label for="message">نص الاستفسار</label>
          <textarea id="message"
                    name="message"
                    rows="5"
                    placeholder="اكتب استفسارك هنا..."
                    required></textarea>
        </div>

        <!-- زر الإرسال -->
        <button type="submit">إرسال الاستفسار</button>
      </fieldset>
    </form>
  </div>

</body>
</html>

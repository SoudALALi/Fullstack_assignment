<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بطاقة تعريف المدرب - coderz</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="page">

    <article class="profile-card">

      <!-- الصورة يمين، المعلومات يسار -->
      <div class="profile-photo">
        <img src="images/Screenshot 2026-11-26 201713.png" alt="صورة المدرب أحمد خالد">
      </div>

      <div class="profile-info">

        <h1 class="name">أحمد خالد</h1>
        <p class="role">مدرب تطوير الويب</p>

        <p class="description">
          أساعدك تتعلم بناء صفحات واضحة ومنظمة خطوة بخطوة.
        </p>

        <!-- صف الشارات -->
        <div class="tags">
          <span class="tag">HTML</span>
          <span class="tag">CSS</span>
          <span class="tag">Git</span>
        </div>

        <!-- صف الأزرار -->
        <div class="actions">
          <button class="btn btn-primary">شاهد الدورات</button>
          <button class="btn btn-outline">تواصل معي</button>
        </div>

      </div>

    </article>

  </main>

</body>
</html>
